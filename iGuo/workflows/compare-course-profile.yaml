name: compare-course-profile
description: 对比个人档案里的课程草稿与课程研发档案（正式）；产物落回自己的档案。跑法：kg --root <本档案> --data <本档案>/iGuo task compare-course-profile --next
steps:
- name: locate
  description: 把两边的档案找齐——个人课程草稿（iGuo/materials/course）与课程研发档案（quanttide-course），指出各自在哪、里面有什么
  executor: agent
  criteria:
  - executor: rule
    description: 个人课程草稿在
    path: iGuo/materials/course/index.md
  - executor: rule
    description: 课程研发档案在
    path: ../../../quanttide-course/data/profile/README.md
- name: compare
  description: 逐项对照两边——口径、重叠、各自的缺口、格式差；产物写到 iGuo/artifacts/report/compare-course-profile.md
  executor: agent
  criteria:
  - executor: rule
    description: 产物落成
    path: iGuo/artifacts/report/compare-course-profile.md
  - executor: rule
    description: 产物点到两边的课
    file: iGuo/artifacts/report/compare-course-profile.md
    contains: production-internship
  - executor: rule
    description: 产物给了两侧缺口
    file: iGuo/artifacts/report/compare-course-profile.md
    contains: 缺口
- name: conclude
  description: 写下差异怎么处置的结论（谁回流给谁、哪些并、哪些不动），并请创始人拍板
  executor: agent
  criteria:
  - executor: rule
    description: 结论写进产物
    file: iGuo/artifacts/report/compare-course-profile.md
    contains: "## 结论"
  - executor: human
    description: 创始人点头（回流与并法怎么定）
