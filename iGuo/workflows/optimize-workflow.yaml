name: optimize-workflow
description: 优化一条工作流定义——把它从「只有验收明确」推到「输入、过程、输出、验收四段都精确」，判准是每一句声明都能派生出判据。目标定义由起任务时指定（任务名与被优化的定义同名，即 <工作流目录>/<任务名>.yaml）；产物是本任务的报告，四节：现状 / 缺口 / 精确版 / 迁移。跑法：qtcloud-work task --new <目标名> --workflow optimize-workflow，再 qtcloud-work task <目标名> --next。四段声明暂时压在每步的 description 里（字段级 schema 还没实现），形状固定：输入 / 过程 / 输出 / 验收
steps:
- name: read
  description: 读清楚。输入：目标工作流的定义文件（<工作流目录>/<任务名>.yaml）。过程：逐字段读，不猜——顶层字段、每一步的 name / executor / criteria；再把每步 description 里的散文逐条摘出来，分成四类（输入、过程、输出、验收）。输出：报告的「现状」一节，按这四类分列，每条注明出自哪一步的哪句原文。验收：一律只核「读出的是不是定义里真有的」，不许补
  executor: agent
  criteria:
  - executor: rule
    description: 「现状」一节在
    file: '{{report}}'
    contains: '## 现状'
  - executor: agent
    description: 逐字段读出、没漏没补；每条都注明出自哪一步的哪句原文
- name: gap
  description: 找缺口。输入：报告的「现状」一节。过程：按四段逐段比——散文里说了但字段里没有的；同一件事写两处的（描述里写一遍、判据里又写一遍）；只能靠人或智能体读、派生不出判据的。输出：报告的「缺口」一节，每条写清三样：缺在哪（哪一步、哪一句）、会造成什么后果（换材料要改散文、两处不一致就出错、同一件事跑两遍结果不同）、补齐后能派生出哪条判据。验收：见判据
  executor: agent
  criteria:
  - executor: rule
    description: 「缺口」一节在
    file: '{{report}}'
    contains: '## 缺口'
  - executor: agent
    description: 每条缺口都点到具体的步与句，并写明后果与补齐后能派生的判据
- name: precise
  description: 写精确版。输入：报告的「缺口」一节。过程：把每条缺口补成声明——输入（读什么、不许读什么）、过程（工具白名单、必做子动作与中间产物、禁忌）、输出（落点、形态、上限、必带字段）、验收（能派生的交给派生，剩下写明判准）；每条声明后跟上它派生出哪条判据。输出：报告的「精确版」一节，直接给出可替换进目标定义的内容。验收：见判据
  executor: agent
  criteria:
  - executor: rule
    description: 「精确版」一节在
    file: '{{report}}'
    contains: '## 精确版'
  - executor: agent
    description: 每条声明都写明了派生出哪条判据；派生不出来的标明档次（智能体 / 人）并写清判准
  - executor: agent
    description: 同一件事只写一处——输出声明与判据不再各写一遍
- name: migrate
  description: 迁移建议。输入：报告的「精确版」一节、平台实现的 schema、规格里工作流那一篇。过程：列出为让这份精确版真的生效要改哪些地方，逐处写清改什么、为什么；标出哪些是破坏性的（老定义读不进来）、哪些可以并存（新字段缺省即老行为）。输出：报告的「迁移」一节，一张清单，至少覆盖五处：目标定义本身、规格（docs/specification/process/workflow.md）、平台实现（apps/qtcloud-work/src/cli 的 schema 与派生）、用例测试、其余在用的工作流。验收：见判据
  executor: agent
  criteria:
  - executor: rule
    description: 「迁移」一节在
    file: '{{report}}'
    contains: '## 迁移'
  - executor: agent
    description: 清单覆盖定义、规格、实现、测试、其余工作流五处，并标出破坏性与可并存
- name: conclude
  description: 收口。输入：上面四节。过程：一句话说清这条工作流现在最缺什么；给出改动前后的对照——改之前能派生多少条判据、改之后多少条；列出仍拿不准的。输出：报告的「结论」一节。验收：见判据
  executor: agent
  criteria:
  - executor: rule
    description: 「结论」一节在
    file: '{{report}}'
    contains: '## 结论'
  - executor: agent
    description: 一句话说得清最缺什么，且给了改动前后的判据条数对照
  - executor: human
    description: 创始人拍板（哪些先改、哪些先不动）
