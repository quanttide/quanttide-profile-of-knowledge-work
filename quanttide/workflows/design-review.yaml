name: design-review
description: 评审一张界面截图——人先给一句第一眼，智能体再清点、给主诊断与证据、按影响提建议、最后复述一句请人拍板。报告按倒金字塔排：第一眼 → 看到 → 主诊断 → 证据 → 旁枝 → 建议 → 结论。产物是本任务的报告；跑法：qtcloud-work task --new <任务名> --workflow design-review，再 qtcloud-work task <任务名> --next（一条一条走）
steps:
- name: impression
  description: 第一眼——由人写：一句话说这张图给人的整体感受（判断，不是清点），写进报告的「第一眼」一节。人做完用 qtcloud-work task <任务名> --done impression --note "第一眼：……" 记一笔
  executor: human
  criteria:
  - executor: rule
    description: 「第一眼」一节在
    file: '{{report}}'
    contains: '## 第一眼'
  - executor: agent
    description: 那一句是判断，不是清点（一句话读得出整体感受）
- name: look
  description: 清点——把图上真有的东西看清楚：有哪些对象、状态、动作、数字，逐区写进报告的「看到」一节。这一节只清点、不下判断，别写「混乱」「不合理」这类词
  executor: agent
  criteria:
  - executor: rule
    description: 「看到」一节在
    file: '{{report}}'
    contains: '## 看到'
  - executor: agent
    description: 「看到」一节里全是清点，没有判断词，也没有编造
- name: review
  description: 判断与证据——先在报告的「主诊断」一节写一句话说清这张图最主要的问题（与人的第一眼对照：一致就说明理由，不一致就说明为什么）；再在「证据」一节列支撑它的观察，至多五处，每处点到图上具体位置；其余观察放进「旁枝」一节当附录；截图上读不出、需要人确认的放进「拿不准」一节
  executor: agent
  criteria:
  - executor: rule
    description: 「主诊断」一节在
    file: '{{report}}'
    contains: '## 主诊断'
  - executor: rule
    description: 「证据」与「旁枝」两节在
    file: '{{report}}'
    contains: '## 证据'
  - executor: rule
    description: 「旁枝」一节在
    file: '{{report}}'
    contains: '## 旁枝'
  - executor: rule
    description: 排在最前的三节顺序对（第一眼 → 看到 → 主诊断）
    run: 'test "$(grep -n "^## 第一眼" {{report}} | cut -d: -f1)" -lt "$(grep -n "^## 看到" {{report}} | cut -d: -f1)" && test "$(grep -n "^## 看到" {{report}} | cut -d: -f1)" -lt "$(grep -n "^## 主诊断" {{report}} | cut -d: -f1)"'
  - executor: agent
    description: 主诊断一句话说得清、与证据对得上；证据不超过五处且都点到图上位置；判断与拿不准的事分开写
- name: advise
  description: 建议——写进报告的「建议」一节：按影响从大到小排，每条写清改哪里、改成什么、为什么，并标出影响面（安全 / 效率 / 辨识）与改动代价（小 / 中 / 大）
  executor: agent
  criteria:
  - executor: rule
    description: 「建议」一节在
    file: '{{report}}'
    contains: '## 建议'
  - executor: agent
    description: 每条建议都带影响面与改动代价，且按影响排序
- name: conclude
  description: 收口——报告的「结论」一节：开头三行依次写「是什么」「问题在哪」「先改什么」，随后一句话复述这张图的问题（与「第一眼」对照），再列仍拿不准的地方，等人拍板
  executor: agent
  criteria:
  - executor: rule
    description: 「结论」一节在
    file: '{{report}}'
    contains: '## 结论'
  - executor: rule
    description: 结论排在建议之后
    run: 'test "$(grep -n "^## 建议" {{report}} | cut -d: -f1)" -lt "$(grep -n "^## 结论" {{report}} | cut -d: -f1)"'
  - executor: agent
    description: 结论开头三行依次是什么、问题在哪、先改什么，且一句话复述与第一眼对得上
  - executor: human
    description: 创始人拍板（哪些建议采纳）
