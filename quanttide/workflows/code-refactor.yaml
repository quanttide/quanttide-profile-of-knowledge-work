name: code-refactor
description: 优化一条工作流定义——把它从「只有验收明确」推到「输入、过程、输出、验收四段都精确」，判准是每一句声明都能派生出判据。目标定义由起任务时指定（任务名与被优化的定义同名，即 <工作流目录>/<任务名>.yaml）。产物分两份：给机器的修订稿落 <数据仓>/artifacts/proposed/<任务名>.yaml，给给人的判断落本任务的报告（主诊断置顶、结论收口，缺口与迁移进附录）。跑法：qtcloud-work task --new <目标名> --workflow code-refactor，再 --next
steps:
- name: read
  description: 读清楚。输入：目标工作流的定义文件（<工作流目录>/<任务名>.yaml）。过程：逐字段读，不猜——顶层字段、每一步的 name / executor / criteria；再把每步 description 里的散文逐条摘出来，分成四类（输入、过程、输出、验收）。输出：报告的附录「现状」一节，按四类分列，每条注明出自哪一步的哪句原文。验收：只核「读出的是不是定义里真有的」，不许补
  executor: agent
  criteria:
  - executor: rule
    description: 附录的「现状」一节在
    file: '{{report}}'
    contains: '## 现状'
  - executor: agent
    description: 逐字段读出、没漏没补；每条都注明出自哪一步的哪句原文
- name: gap
  description: 找缺口、下判断。输入：附录的「现状」。过程：按四段逐段比，只挑最要紧的——一条主诊断（这条工作流现在最缺什么，一句话）＋至多五条缺口（每条写清缺在哪句、什么后果、补齐后能派生出哪条判据）；其余观察收进附录「旁枝」。输出：报告的「主诊断」一节（排在附录之前）＋附录「缺口」一节。验收：见判据
  executor: agent
  criteria:
  - executor: rule
    description: 「主诊断」一节在
    file: '{{report}}'
    contains: '## 主诊断'
  - executor: rule
    description: 附录的「缺口」一节在
    file: '{{report}}'
    contains: '## 缺口'
  - executor: rule
    description: 主诊断排在附录之前
    run: 'test "$(grep -n "^## 主诊断" {{report}} | cut -d: -f1)" -lt "$(grep -n "^## 现状" {{report}} | cut -d: -f1)"'
  - executor: agent
    description: 主诊断一句话说得出最缺什么；缺口不超过五条，超出的进了旁枝
- name: precise
  description: 写修订稿。输入：主诊断与五条缺口。过程：把缺口补成声明——输入（读什么、不许读什么）、过程（工具白名单、必做子动作与中间产物、禁忌）、输出（落点、形态、上限、必带字段）、验收（能派生的交给派生，剩下写明判准）。输出：修订后的**完整定义**落 <数据仓>/artifacts/proposed/<任务名>.yaml，具体值（节名、上限、词表、必带字段）只在那一份里出现一次；报告另写「建议」一节，只说改了哪几处、每处派生出哪条判据，不复述具体值。验收：见判据
  executor: agent
  criteria:
  - executor: rule
    description: 修订稿落在 proposed 目录
    run: 'test -f "$(dirname {{report}})/../proposed/$(basename {{report}} .md).yaml"'
  - executor: rule
    description: 「建议」一节在
    file: '{{report}}'
    contains: '## 建议'
  - executor: agent
    description: 修订稿与目标定义同构（顶层与步骤字段读得进）、四段齐全、每条声明可派生
  - executor: agent
    description: 具体值只在修订稿里出现一次，报告不复述
- name: migrate
  description: 迁移建议。输入：修订稿、平台实现的 schema、规格里工作流那一篇。过程：列出让修订稿真的生效要改哪些地方——定义本身、规格、实现 schema 与派生、用例测试、其余在用的工作流；逐处写清改什么、为什么、破坏性还是可并存，并按先后排序。输出：报告的附录「迁移」一节。验收：见判据
  executor: agent
  criteria:
  - executor: rule
    description: 附录的「迁移」一节在
    file: '{{report}}'
    contains: '## 迁移'
  - executor: agent
    description: 清单覆盖定义、规格、实现、测试、其余工作流五处，标出破坏性与可并存，并按先后排了序
- name: conclude
  description: 收口。输入：主诊断、建议、迁移。过程：写「结论」一节——开头三行（这份工作流是什么 / 最缺什么 / 先改哪一处），随后给改动前后的判据条数对照，末尾一句复述主诊断。输出：报告的「结论」一节。验收：见判据，含一条可转发检验
  executor: agent
  criteria:
  - executor: rule
    description: 「结论」一节在
    file: '{{report}}'
    contains: '## 结论'
  - executor: rule
    description: 结论排在建议之后
    run: 'test "$(grep -n "^## 建议" {{report}} | cut -d: -f1)" -lt "$(grep -n "^## 结论" {{report}} | cut -d: -f1)"'
  - executor: rule
    description: 报告（含程序两节与附录）不超过 80 行——超了说明没提炼
    run: 'test "$(wc -l < {{report}})" -le 80'
  - executor: agent
    description: 结论开头三行依次是什么、最缺什么、先改哪一处，并给了改动前后的判据条数对照
  - executor: agent
    description: 可转发检验——把「主诊断＋建议＋结论」单独拿出来，能当一份能直接用的判断（够当一份 issue 的标题与正文）
  - executor: human
    description: 创始人拍板（哪些先改、哪些先不动）
