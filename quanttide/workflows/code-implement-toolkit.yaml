name: code-implement-toolkit
description: 把命令行与 studio 里意义相同的领域模型抽到 toolkit。两侧（`apps/qtcloud-work/src/cli` 的 Rust 与 `apps/qtcloud-work/src/studio` 的 Dart）现在各写了一份同样的模型——信封、执行者、步骤与判据、任务与流转账；这份活儿是把它们抽到 `packages/quanttide-work-toolkit`，Rust 与 Dart 各落一份，并用同一批用例向量做契约测试；**先把 toolkit 发出去**（crates.io 与 pub.dev），两侧才能依赖版本号而不是本地路径；替换完行为一字不改（尺子为证）。产物是本任务的报告，六节：对照 / 抽取 / 契约 / 发布 / 替换 / 结论。跑法：qtcloud-work task --new code-implement-toolkit --workflow code-implement-toolkit，再 --next 一条一条走
steps:
- name: compare
  description: 对比两侧。输入：`apps/qtcloud-work/src/cli/src/` 里的 Rust 模型、`apps/qtcloud-work/src/studio/lib/core/` 里的 Dart 模型、尺子 `apps/qtcloud-work/src/studio/scripts/parity.sh`。过程：逐个名词找两侧意义相同的那一份（信封 `Outcome`、执行者与判据种类、工作流定义与步骤、任务与流水、闸门项与产物落点），逐项写出两侧的字段、取值、算法与报错文字，标出「完全相同 / 只差写法 / 只是同名不同义」；再跑一遍尺子，把当前的一致与缺口抄进报告的「对照」一节。输出：一张逐项对照表 + 抽取范围的建议。验收：见判据——表里每一项都要两侧都点到，漏一侧不算
  executor: agent
  criteria:
  - executor: rule
    description: 两侧现在说的是同一件事（尺子为证）
    run: sh apps/qtcloud-work/src/studio/scripts/parity.sh
  - executor: rule
    description: 对照表写进报告
    file: '{{report}}'
    contains: '## 对照'
  - executor: agent
    description: 每一项都写了「完全相同 / 只差写法 / 只是同名不同义」三种里的哪一种，并指出各自在哪一行；没有「（待查）」
  - executor: human
    description: 创始人定抽取范围：哪些进 toolkit，哪些留在各自包里
- name: extract
  description: 抽进 toolkit。输入：上一步定下的范围、`packages/quanttide-work-toolkit/packages/rust/`（crate `quanttide-work`）与 `packages/quanttide-work-toolkit/packages/dart/`（包 `quanttide_work`）。过程：两侧各落一份模型——字段名、取值、算法与报错文字与原来逐字对齐（抽取不改行为）；测试跟着落，不许留空壳；两个包的清单版本与 CHANGELOG 该动就动。输出：两侧的模型与测试；搬了哪些、还留哪些，抄进报告的「抽取」一节。验收：见判据
  executor: agent
  criteria:
  - executor: rule
    description: Rust 包门禁全过（与 toolkit 的 AGENTS.md 一字不差）
    run: cd packages/quanttide-work-toolkit/packages/rust && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test --locked
  - executor: rule
    description: Dart 包门禁全过（与 toolkit 的 AGENTS.md 一字不差）
    run: cd packages/quanttide-work-toolkit/packages/dart && dart analyze lib/ test/ && dart test
  - executor: rule
    description: 抽取记录写进报告
    file: '{{report}}'
    contains: '## 抽取'
  - executor: agent
    description: 两侧同一件事的字段名与取值逐字对齐；两侧的测试都不是空壳（零条测试挡在这里）；报错文字照抄，没有顺手改写
- name: contract
  description: 契约测试。输入：上一步落在 toolkit 两侧的模型。过程：把契约写成**用例向量**——一批 JSON 或 YAML 文件，一对输入与期望输出，两种语言都读同一批文件；写 `packages/quanttide-work-toolkit/scripts/contract.sh`（或同等的两侧入口）跑同一批向量，两侧结论必须一样。向量要盖到每个字段与边界：缺字段、多字段、取值不对各给什么。输出：向量与契约脚本；跑一次的输出抄进报告的「契约」一节。验收：见判据
  executor: agent
  criteria:
  - executor: rule
    description: 同一批向量，两侧给同一个结论
    run: cd packages/quanttide-work-toolkit && sh scripts/contract.sh
  - executor: rule
    description: 契约结果写进报告
    file: '{{report}}'
    contains: '## 契约'
  - executor: agent
    description: 向量是两侧共用的同一批文件（不是各写一份测试各说各话）；边界齐（缺字段、多字段、取值不对）；有一处故意写坏的记录，证明向量真会红
- name: publish-rust
  description: 发布 Rust 那个包。输入：`packages/quanttide-work-toolkit/packages/rust`（crate `quanttide-work`，发 crates.io）。过程：toolkit 的约定是**一个语言包一条发布线**——Rust 与 Dart 各自定版本、各自发，互不牵连（标签形如 `rust/vX.Y.Z-alpha.N`）；版本号暂时取 `alpha.N`（档位走 `alpha`（能跑，会用的人先试）→ `beta` → `rc` → 正式版）；把包内 `[Unreleased]` 落成 `## [X.Y.Z-alpha.N]`、清单版本与 `Cargo.lock` 同步（锁文件与版本同一提交，否则发布的 `--locked` 会红）；预检与门禁全过；请创始人放行；`qtcloud-devops release publish -v rust/vX.Y.Z-alpha.N` 建 tag 推远端，toolkit 的 `release-rust.yml` 随之发到 crates.io。输出：这个包在 crates.io 上；版本号、tag、发布结果抄进报告的「发布」一节。没有这一步，下一步的替换只能挂本地路径，那不算抽出去。验收：见判据
  executor: agent
  criteria:
  - executor: rule
    description: 版本号写法在 alpha 档（X.Y.Z-alpha.N）
    run: grep -qE '^version = "[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+"' packages/quanttide-work-toolkit/packages/rust/Cargo.toml
  - executor: rule
    description: 清单版本与 CHANGELOG 对得上
    run: grep -q "^## \[$(sed -n 's/^version = "\(.*\)"/\1/p' packages/quanttide-work-toolkit/packages/rust/Cargo.toml | head -1)\]" packages/quanttide-work-toolkit/packages/rust/CHANGELOG.md
  - executor: rule
    description: 这个包的发布工作流跑绿了
    run: gh run list --repo quanttide/quanttide-work-toolkit --workflow release-rust.yml --limit 1 --json conclusion -q '.[0].conclusion' | grep -q success
  - executor: rule
    description: rust 的 tag 已在远端
    run: test -n "$(git -C packages/quanttide-work-toolkit ls-remote --tags origin 'rust/v*')"
  - executor: rule
    description: 发布记录写进报告的「发布」一节
    file: '{{report}}'
    contains: '## 发布'
  - executor: agent
    description: 版本是这一轮新落的（不是拿旧版本充数）；这个包在 crates.io 上查得到
  - executor: human
    description: 创始人放行 rust 这次发布（定了版本号就不再改）
- name: publish-dart
  description: 发布 Dart 那个包。输入：`packages/quanttide-work-toolkit/packages/dart`（包 `quanttide_work`，发 pub.dev）。过程：与 Rust 那条**各发各的**——Dart 的版本号跟自己的改动走，不必与 Rust 对齐（标签形如 `dart/vX.Y.Z-alpha.N`）；版本号暂时取 `alpha.N`；把 `[Unreleased]` 落成 `## [X.Y.Z-alpha.N]`、清单版本同步；预检与门禁全过；请创始人放行；`qtcloud-devops release publish -v dart/vX.Y.Z-alpha.N` 建 tag 推远端，`release-dart.yml` 随之发到 pub.dev（凭证是 `PUBDEV_CREDENTIAL_JSON`，落成 pub 缓存的 `credentials.json`）。输出：这个包在 pub.dev 上；版本号、tag、发布结果抄进报告的「发布」一节。验收：见判据
  executor: agent
  criteria:
  - executor: rule
    description: 版本号写法在 alpha 档（X.Y.Z-alpha.N）
    run: grep -qE '^version[:] [0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+' packages/quanttide-work-toolkit/packages/dart/pubspec.yaml
  - executor: rule
    description: 清单版本与 CHANGELOG 对得上
    run: grep -q "^## \[$(sed -n 's/^version[:][ ]\(.*\)/\1/p' packages/quanttide-work-toolkit/packages/dart/pubspec.yaml | head -1)\]" packages/quanttide-work-toolkit/packages/dart/CHANGELOG.md
  - executor: rule
    description: 这个包的发布工作流跑绿了
    run: gh run list --repo quanttide/quanttide-work-toolkit --workflow release-dart.yml --limit 1 --json conclusion -q '.[0].conclusion' | grep -q success
  - executor: rule
    description: dart 的 tag 已在远端
    run: test -n "$(git -C packages/quanttide-work-toolkit ls-remote --tags origin 'dart/v*')"
  - executor: rule
    description: 发布记录写进报告的「发布」一节
    file: '{{report}}'
    contains: '## 发布'
  - executor: agent
    description: 版本是这一轮新落的（不是拿旧版本充数）；这个包在 pub.dev 上查得到
  - executor: human
    description: 创始人放行 dart 这次发布（定了版本号就不再改）
- name: adopt
  description: 替换到位。输入：已发布的 toolkit 两个包、cli 与 studio。过程：两侧删掉自己的同名模型，改成引用**已发布的** toolkit 版本（Rust 写版本号依赖 crates.io，Dart 写版本号依赖 pub.dev；挂本地路径不算抽出去），先编译、再跑各自门禁、再跑尺子——行为一字不改才算过。输出：两侧的依赖改动与删掉的文件清单，抄进报告的「替换」一节。验收：见判据
  executor: agent
  criteria:
  - executor: rule
    description: 命令行依赖的是发布出去的版本号（不是 path）
    run: grep -qE '^quanttide-work *= *"[0-9]' apps/qtcloud-work/src/cli/Cargo.toml
  - executor: rule
    description: studio 依赖的是发布出去的版本号（不是 path）
    run: grep -qE '^  quanttide_work[:] *\^?[0-9]' apps/qtcloud-work/src/studio/pubspec.yaml
  - executor: rule
    description: 命令行门禁全过
    run: cd apps/qtcloud-work/src/cli && cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
  - executor: rule
    description: studio 门禁全过
    run: cd apps/qtcloud-work/src/studio && flutter analyze && flutter test
  - executor: rule
    description: 行为一字未改（尺子为证）
    run: sh apps/qtcloud-work/src/studio/scripts/parity.sh
  - executor: rule
    description: 替换记录写进报告
    file: '{{report}}'
    contains: '## 替换'
  - executor: agent
    description: 两侧不再留同名模型（都指到 toolkit）；抽取过程中没有顺手改行为，尺子与两侧门禁都能证明
  - executor: human
    description: 创始人确认可以合并：抽取这件事值不值得（多一层依赖换掉两份重复）
- name: conclude
  description: 收口。输入：对照 / 抽取 / 契约 / 发布 / 替换五节。过程：写「结论」一节——开头三行（抽了什么 / 两侧现在共用到什么程度 / 还差什么），随后列仍拿不准的（例如什么该进 toolkit、什么该留各自包；toolkit 的版本与发版节奏要不要跟两侧对齐）。输出：报告的「结论」一节。验收：见判据
  executor: agent
  criteria:
  - executor: rule
    description: 「结论」一节在
    file: '{{report}}'
    contains: '## 结论'
  - executor: agent
    description: 三行说得清抽了什么、共用到什么程度、还差什么；拿不准的单列，不混在结论里
