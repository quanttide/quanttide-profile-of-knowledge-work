name: code-implement
description: 把实验室验证过的做法扶正成平台能力——列清单、重写成三部分文档（含用例）、照用例设计测试（对账脚本 + 实现缺席时必须红）、再写实现让测试变绿。文档与测试落 apps/qtcloud-work/src/cli/；本任务的报告在 data/context/qtcloud-work/artifacts/report/code-implement.md（「清单」与「对账」两节）。跑法：kg --data <领域仓>/data/context/qtcloud-work task code-implement --next（工作区与工作流目录随任务记着）
steps:
- name: outline
  description: 逐动作、逐字段、逐判据列出这份规格要写什么，来源是实验室已经实现的东西——实验室有的不能漏，清单里也不能凭空多出没做过的事。清单写进本任务报告的「清单」一节
  executor: agent
  criteria:
  - executor: rule
    description: 清单写进报告
    file: '{{report}}'
    contains: '## 清单'
  - executor: agent
    description: 清单每条都有出处（实验室的实现或规格），没有凭空造出来的条目
- name: doc
  description: 照清单重写三部分文档，写在 apps/qtcloud-work/src/cli/docs/ 下——user-guide 讲怎么用、dev-guide 讲程序怎么继续长、api-references 收命令与数据的参考。实验室那份不搬；真实业务写成用例沉在 user-guide 里，每条一个小节，标题形如「## 用例 一、起一件任务并走一步」，做过几件写几件
  executor: agent
  criteria:
  - executor: rule
    description: 使用指南在
    path: apps/qtcloud-work/src/cli/docs/user-guide/index.md
  - executor: rule
    description: 开发指南在
    path: apps/qtcloud-work/src/cli/docs/dev-guide/index.md
  - executor: rule
    description: 接口参考在
    path: apps/qtcloud-work/src/cli/docs/api-references/index.md
  - executor: rule
    description: 用例写进了使用指南
    file: apps/qtcloud-work/src/cli/docs/user-guide/index.md
    contains: '## 用例'
  - executor: agent
    description: 清单里的条目都落到了文档里，用例都出自做过的真事
  - executor: human
    description: 文档定稿（内容取舍只能人拍）
- name: test
  description: 照用例设计测试，写在 apps/qtcloud-work/src/cli/tests/usecases.rs，每条测试上面一行注释写出处（形如「// 用例：一」）；写 apps/qtcloud-work/src/cli/scripts/validate-usecases.sh 做双向对账（文档里的用例号与测试里的出处，两边集合必须相等）；对账结果与一次红的记录写进本任务报告的「对账」一节
  executor: agent
  criteria:
  - executor: rule
    description: 测试在
    path: apps/qtcloud-work/src/cli/tests/usecases.rs
  - executor: rule
    description: 对账脚本在
    path: apps/qtcloud-work/src/cli/scripts/validate-usecases.sh
  - executor: rule
    description: 对账过得去（用例与测试两边名字相等）
    run: cd apps/qtcloud-work/src/cli && sh scripts/validate-usecases.sh
  - executor: rule
    description: 实现缺席时测试是红的
    run: cd apps/qtcloud-work/src/cli && ! cargo test --quiet
  - executor: rule
    description: 对账写进报告
    file: '{{report}}'
    contains: '## 对账'
  - executor: agent
    description: 每条用例都有测试，没有恒绿的空壳
- name: code
  description: 写实现让测试变绿，逐条转绿的过程记进报告；这一轮先不接 provider，本地做法照实验室的来。文档与测试这一轮不动，要改从文档改起
  executor: agent
  criteria:
  - executor: rule
    description: 测试不是零条（空壳挡在这里）
    run: test "$(cd apps/qtcloud-work/src/cli && cargo test --quiet -- --list 2>/dev/null | grep -c test)" -ge 1
  - executor: rule
    description: 测试全绿
    run: cd apps/qtcloud-work/src/cli && cargo test --quiet
  - executor: human
    description: 代码验收（能不能上平台）
